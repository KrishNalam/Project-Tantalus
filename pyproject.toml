[project]
name = "tantalus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KrishNalam", email = "nalamkrish1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "rdkit>=2026.3.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.0.post1",
]

[project.scripts]
tantalus = "tantalus:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

# PyTorch Geometric does not depend on torch directly (it can't know which
# CPU/CUDA build you want). Route torch to the CPU-only wheel index so we get the
# small ~200MB build instead of PyPI's default CUDA build. See docs/decisions.md.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
